name: Uptime and Pipeline Health

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  uptime:
    name: Backend uptime check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check backend API is reachable
        env:
          SORTVIEW_API_BASE_URL: ${{ secrets.SORTVIEW_API_BASE_URL }}
          SORTVIEW_ALERT_EMAIL_TO: ${{ secrets.SORTVIEW_ALERT_EMAIL_TO }}
          SORTVIEW_SMTP_HOST: ${{ secrets.SORTVIEW_SMTP_HOST }}
          SORTVIEW_SMTP_PORT: ${{ secrets.SORTVIEW_SMTP_PORT }}
          SORTVIEW_SMTP_USERNAME: ${{ secrets.SORTVIEW_SMTP_USERNAME }}
          SORTVIEW_SMTP_PASSWORD: ${{ secrets.SORTVIEW_SMTP_PASSWORD }}
          SORTVIEW_EMAIL_FROM: ${{ secrets.SORTVIEW_EMAIL_FROM }}
        run: python scripts/check_uptime.py

  pipeline-health:
    name: Pipeline health check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install DB dependencies
        run: >
          python -m pip install --upgrade pip &&
          pip install sqlalchemy==2.0.51 psycopg2-binary==2.9.12

      - name: Check every active branch is still reporting in
        env:
          DATABASE_URL: ${{ secrets.SORTVIEW_MONITOR_DATABASE_URL }}
          SORTVIEW_PIPELINE_STALE_MINUTES: ${{ vars.SORTVIEW_PIPELINE_STALE_MINUTES }}
          SORTVIEW_ALERT_EMAIL_TO: ${{ secrets.SORTVIEW_ALERT_EMAIL_TO }}
          SORTVIEW_SMTP_HOST: ${{ secrets.SORTVIEW_SMTP_HOST }}
          SORTVIEW_SMTP_PORT: ${{ secrets.SORTVIEW_SMTP_PORT }}
          SORTVIEW_SMTP_USERNAME: ${{ secrets.SORTVIEW_SMTP_USERNAME }}
          SORTVIEW_SMTP_PASSWORD: ${{ secrets.SORTVIEW_SMTP_PASSWORD }}
          SORTVIEW_EMAIL_FROM: ${{ secrets.SORTVIEW_EMAIL_FROM }}
        run: python scripts/check_pipeline_health.py